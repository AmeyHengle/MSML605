name: Deploy

on:
  push:
    branches:
      - amey-demo

jobs:
  # ── Job 1: Unit tests (gate) ─────────────────────────────────────────────────
  unit-tests:
    name: Unit tests — pipeline.py
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: amey-demo

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-cov

      - name: Run unit tests
        run: |
          pytest tests/test_pipeline.py -v \
            --tb=short \
            --cov=pipeline \
            --cov-report=term-missing \
            --cov-fail-under=70
        env:
          PYTHONPATH: .

  # ── Job 2: Deploy frontend to GitHub Pages ───────────────────────────────────
  deploy-frontend:
    name: Deploy frontend to GitHub Pages
    runs-on: ubuntu-latest
    needs: unit-tests
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: amey-demo

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend
          publish_branch: gh-pages
          force_orphan: true

  # ── Job 3: Deploy to Render ───────────────────────────────────────────────────
  deploy-backend:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Ping Render deploy webhook
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "Missing RENDER_DEPLOY_HOOK_URL secret"
            exit 1
          fi

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --request POST \
            "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
          echo "Render webhook response: $STATUS"
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "201" ]; then
            echo "Render webhook failed with status $STATUS"
            exit 1
          fi

  # ── Job 4: Post-deploy smoke tests ────────────────────────────────────────────
  smoke-tests:
    name: Post-deploy smoke tests
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: amey-demo

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install test dependencies
        run: pip install requests pytest pytest-timeout

      - name: Poll until service is live
        run: |
          MAX=18
          COUNT=0
          until curl -sf "${{ secrets.RENDER_URL }}/api/status" > /dev/null; do
            COUNT=$((COUNT+1))
            if [ $COUNT -ge $MAX ]; then
              echo "Service did not come up after $((MAX*10))s"
              exit 1
            fi
            echo "Attempt $COUNT/$MAX — retrying in 10s..."
            sleep 10
          done
          echo "Service is live"

      - name: Run smoke tests
        run: |
          pytest tests/test_api.py -v \
            --tb=short \
            -k "not TestSimulate" \
            --timeout=60
        env:
          BASE_URL: ${{ secrets.RENDER_URL }}
          PYTHONPATH: .

  # ── Job 5: Slack alert on failure ─────────────────────────────────────────────
  notify-failure:
    name: Slack alert — deploy failed
    runs-on: ubuntu-latest
    needs: [unit-tests, deploy-frontend, deploy-backend, smoke-tests]
    if: |
      failure() &&
      !startsWith(github.event.head_commit.message, 'Revert')
    steps:
      - name: Send Slack failure alert
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
        run: |
          SHORT_SHA="${COMMIT_SHA:0:7}"
          SAFE_MSG=$(echo "$COMMIT_MSG" | sed 's/"/\\"/g' | head -c 120)

          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "{
              \"attachments\": [{
                \"color\": \"#E24B4A\",
                \"blocks\": [
                  {
                    \"type\": \"header\",
                    \"text\": {
                      \"type\": \"plain_text\",
                      \"text\": \":rotating_light:  Deploy failed — $BRANCH\",
                      \"emoji\": true
                    }
                  },
                  {
                    \"type\": \"section\",
                    \"fields\": [
                      {\"type\": \"mrkdwn\", \"text\": \"*Commit*\n\`$SHORT_SHA\` — $SAFE_MSG\"},
                      {\"type\": \"mrkdwn\", \"text\": \"*Author*\n$COMMIT_AUTHOR\"},
                      {\"type\": \"mrkdwn\", \"text\": \"*Branch*\n$BRANCH\"},
                      {\"type\": \"mrkdwn\", \"text\": \"*Status*\nAutomatic rollback in progress...\"}
                    ]
                  },
                  {
                    \"type\": \"actions\",
                    \"elements\": [{
                      \"type\": \"button\",
                      \"text\": {\"type\": \"plain_text\", \"text\": \"View failed run\"},
                      \"url\": \"$RUN_URL\",
                      \"style\": \"danger\"
                    }]
                  }
                ]
              }]
            }"

  # ── Job 6: Automatic git revert rollback ──────────────────────────────────────
  rollback:
    name: Auto rollback — git revert
    runs-on: ubuntu-latest
    needs: [smoke-tests]
    if: ${{ needs.smoke-tests.result == 'failure' && !startsWith(github.event.head_commit.message, 'Revert') }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: amey-demo
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Revert last commit and push
        run: |
          FAILED_SHA="${{ github.sha }}"
          SHORT_SHA="${FAILED_SHA:0:7}"
          echo "Reverting commit $SHORT_SHA..."

          # If HEAD is a merge commit, revert using mainline parent 1.
          PARENT_COUNT=$(git rev-list --parents -n 1 HEAD | awk '{print NF-1}')
          if [ "$PARENT_COUNT" -gt 1 ]; then
            echo "HEAD is a merge commit; using git revert -m 1"
            git revert -m 1 HEAD --no-edit
          else
            git revert HEAD --no-edit
          fi

          git push origin amey-demo
          echo "Revert pushed — new deploy will trigger automatically"

      - name: Send Slack rollback confirmation
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          FAILED_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
        run: |
          SHORT_SHA="${FAILED_SHA:0:7}"
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "{
              \"attachments\": [{
                \"color\": \"#f5a623\",
                \"blocks\": [
                  {
                    \"type\": \"header\",
                    \"text\": {
                      \"type\": \"plain_text\",
                      \"text\": \":rewind:  Rollback initiated — $BRANCH\",
                      \"emoji\": true
                    }
                  },
                  {
                    \"type\": \"section\",
                    \"fields\": [
                      {\"type\": \"mrkdwn\", \"text\": \"*Reverted commit*\n\`$SHORT_SHA\`\"},
                      {\"type\": \"mrkdwn\", \"text\": \"*Action*\nPrevious working commit redeploying now\"}
                    ]
                  },
                  {
                    \"type\": \"actions\",
                    \"elements\": [{
                      \"type\": \"button\",
                      \"text\": {\"type\": \"plain_text\", \"text\": \"View run\"},
                      \"url\": \"$RUN_URL\"
                    }]
                  }
                ]
              }]
            }"

  # ── Job 7: Post retrain/drift report to Slack ─────────────────────────────────
  post-drift-report:
    name: Slack report — main retrain PDF
    runs-on: ubuntu-latest
    needs: [deploy-backend, smoke-tests]
    if: ${{ needs.smoke-tests.result == 'success' && !startsWith(github.event.head_commit.message, 'Revert') }}
    steps:
      - name: Generate main-pipeline retrain report on deployed service
        env:
          RENDER_URL: ${{ secrets.RENDER_URL }}
        run: |
          echo "Generating main pipeline retrain report on ${RENDER_URL}..."
          curl -fsS -X POST "${RENDER_URL}/api/retrain-report/run" > /tmp/retrain_report.json
          cat /tmp/retrain_report.json

      - name: Send Slack drift report summary
        env:
          RENDER_URL: ${{ secrets.RENDER_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL is empty; skipping drift report notification"
            exit 0
          fi

          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          report = json.load(open("/tmp/retrain_report.json"))
          status = report.get("status")
          if status == "failed":
              raise SystemExit("Retrain report generation failed")
          if status != "succeeded":
              raise SystemExit(f"Unexpected retrain report status: {status}")

          metrics = report.get("metrics", {})
          retrain_found = bool(report.get("retrain_found"))
          summary = str(report.get("summary", "Summary unavailable"))[:1200]
          pdf_rel = report.get("report_url_pdf", "")
          html_rel = report.get("report_url_html", "")
          pdf_url = report.get("report_s3_pdf_url") or (f"{os.environ['RENDER_URL']}{pdf_rel}" if pdf_rel else "not available")
          html_url = report.get("report_s3_html_url") or (f"{os.environ['RENDER_URL']}{html_rel}" if html_rel else "not available")
          drifted = ", ".join(metrics.get("top_drift_features", [])[:6]) or "none"
          title = f":bar_chart: Main pipeline retrain report — {os.environ['BRANCH']}"
          color = "#2eb67d" if retrain_found else "#f5a623"
          retrain_label = "true" if retrain_found else "false"

          payload = {
              "attachments": [{
                  "color": color,
                  "blocks": [
                      {
                          "type": "header",
                          "text": {"type": "plain_text", "text": title, "emoji": True},
                      },
                      {
                          "type": "section",
                          "fields": [
                              {"type": "mrkdwn", "text": f"*Generated at*\n{report.get('generated_at', 'n/a')}"},
                              {"type": "mrkdwn", "text": f"*Retrain detected*\n{retrain_label}"},
                              {"type": "mrkdwn", "text": f"*KS*\n{metrics.get('ks_stat', 'n/a')}"},
                              {"type": "mrkdwn", "text": f"*PSI*\n{metrics.get('psi', 'n/a')}"},
                              {"type": "mrkdwn", "text": f"*R2*\n{metrics.get('r2', 'n/a')}"},
                              {"type": "mrkdwn", "text": f"*RMSE*\n{metrics.get('rmse', 'n/a')}"},
                              {"type": "mrkdwn", "text": f"*Top drift features*\n{drifted}"},
                          ],
                      },
                      {
                          "type": "section",
                          "fields": [
                              {"type": "mrkdwn", "text": f"*PDF report*\n{pdf_url}"},
                              {"type": "mrkdwn", "text": f"*HTML report*\n{html_url}"},
                          ],
                      },
                      {
                          "type": "section",
                          "text": {
                              "type": "mrkdwn",
                              "text": f"*Groq narrative*\n{summary}",
                          },
                      },
                      {
                          "type": "actions",
                          "elements": [{
                              "type": "button",
                              "text": {"type": "plain_text", "text": "View workflow run"},
                              "url": os.environ["RUN_URL"],
                          }],
                      },
                  ],
              }]
          }

          req = urllib.request.Request(
              os.environ["SLACK_WEBHOOK_URL"],
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(req) as resp:
                  print(resp.read().decode("utf-8", errors="ignore"))
          except urllib.error.HTTPError as e:
              body = e.read().decode("utf-8", errors="ignore")
              print(f"Slack webhook HTTPError {e.code}: {body}")
              raise
          PY

  # ── Job 8: DORA metrics (always runs) ─────────────────────────────────────────
  record-dora:
    name: Record DORA metrics
    runs-on: ubuntu-latest
    needs: smoke-tests
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          ref: amey-demo

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install requests python-dateutil

      - name: Compute DORA metrics
        run: python scripts/dora_metrics.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: AmeyHengle/MSML605
          WORKFLOW_NAME: Deploy
          DEPLOY_JOB: deploy-backend
          SMOKE_JOB: smoke-tests
          DAYS_WINDOW: 30
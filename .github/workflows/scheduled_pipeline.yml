# .github/workflows/scheduled_pipeline.yml
name: Scheduled Pipeline

on:
  schedule:
    # Run at 08:00 and 20:00 UTC daily
    - cron: "0 8 * * *"
    - cron: "0 20 * * *"
  workflow_dispatch:  # Allow manual trigger from GitHub UI

jobs:
  pipeline:
    runs-on: ubuntu-latest
    env:
      PIPELINE_WINDOW_HOURS: "12"
      PIPELINE_INTERVAL_SECONDS: "1800"
      MLFLOW_EXPERIMENT: "daily-intensity-pipeline"
      # Set MLFLOW_TRACKING_URI as a GitHub Secret for remote tracking server.
      # If not set, defaults to local ./mlruns (ephemeral on GitHub runners).
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.10.10"
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync

      - name: Run daily pipeline (drift check + conditional retraining)
        run: uv run python run_pipeline.py

      - name: Report failure
        if: failure()
        run: |
          echo "Pipeline failed at $(date -u)" >> pipeline_failure.log
          echo "Branch: ${{ github.ref }}" >> pipeline_failure.log
          echo "Run ID: ${{ github.run_id }}" >> pipeline_failure.log

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-failure-${{ github.run_id }}
          path: pipeline_failure.log
          retention-days: 7

[project]
name = "ml605-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mlflow>=3.10.1",
    "pandas>=2.3.3",
    "pytest>=9.0.2",
    "scikit-learn>=1.8.0",
    "scipy>=1.13",
    "fastmcp>=3.1.1,<4",
    "langchain-mcp-adapters>=0.2.2,<1",
    "langgraph>=1.1.3",
    "shap>=0.51.0",
    "groq>=1.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest-asyncio>=1.0",
    "httpx>=0.27,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests requiring live external services",
]

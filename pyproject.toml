[project]
name = "msml605-project"
version = "0.1.0"
description = "CarbonWatch + modular drift pipeline"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    "pandas>=2.2.2",
    "numpy>=1.26.4",
    "scipy>=1.13.1",
    "scikit-learn>=1.5.1",
    "boto3>=1.35.0",
    "requests>=2.32.3",
    "python-dotenv>=1.0.1",
    "fastmcp>=3.1.1,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.2",
    "pytest-cov>=5.0.0",
    "pytest-timeout>=2.3.1",
    "httpx>=0.27,<1",
    "locust>=2.31.0",
    "python-dateutil>=2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml605_pipeline", "src/ml605_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
